name: Framework Academy - Qualidade
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Testar as 42 combinacoes de exercicio/framework
        run: python -m unittest discover -s tests -v
      - name: Validar sintaxe de JavaScript incorporado
        run: |
          python - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path
          source = Path('templates/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', source, flags=re.I)
          checked = 0
          with tempfile.TemporaryDirectory() as tmp:
              for i, body in enumerate(scripts):
                  if not body.strip():
                      continue
                  filename = Path(tmp) / f'inline_{i}.js'
                  filename.write_text(body, encoding='utf-8')
                  subprocess.run(['node', '--check', str(filename)], check=True)
                  checked += 1
          assert checked >= 2, f'Esperados scripts inline, encontrados: {checked}'
          print(f'{checked} scripts com sintaxe válida')
          PY

      - name: Instalar Chromium para testes de usabilidade
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Iniciar aplicação Flask com base de testes isolada
        env:
          DATABASE_URL: sqlite:////tmp/fa_e2e.sqlite
          SECRET_KEY: chave-temporaria-apenas-para-ci
          COOKIE_SECURE: 'false'
        run: |
          gunicorn app:app -w 1 --bind 127.0.0.1:5300 --daemon
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:5300',timeout=2):
                      print('Servidor pronto')
                      break
              except Exception:
                  time.sleep(1)
          else:
              raise RuntimeError('Flask não iniciou para testes')
          PY
      - name: Testar onboarding, navegação das 42 questões e biblioteca no navegador
        env:
          FA_TEST_URL: http://127.0.0.1:5300
        run: python tests/e2e_browser.py
